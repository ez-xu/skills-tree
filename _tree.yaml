# Skills Tree 配置文件
# 定义技能分类树和外部来源映射

version: "1.0"

# ============================================================
# 外部来源 — 通过 symlink 链接的外部技能仓库
# ============================================================
sources:
  kicad-happy:
    remote: https://github.com/aklofas/kicad-happy.git
    local_path: C:/Users/15854/kicad-happy
    skills_dir: skills
    skills:
      - bom
      - datasheets
      - digikey
      - element14
      - emc
      - jlcpcb
      - kicad
      - lcsc
      - mouser
      - pcbway
      - spice

  easyeda-api:
    type: submodule
    remote: https://github.com/easyeda/easyeda-api-skill.git
    local_dir: _sources/easyeda-api-skill
    skills:
      - easyeda-api

